<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT Sponsorship Analyzer 24/7</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>body{font-family:system-ui;background:#0b0e14;color:#e6e9f0;margin:0}header{padding:16px 24px;background:#121724;display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,select,button{padding:9px 12px;border-radius:8px;border:1px solid #2a3347;background:#1a2130;color:#fff}button{background:#3b82f6;border:none;cursor:pointer;font-weight:600}main{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){main{grid-template-columns:1fr}}.card{background:#121724;border:1px solid #232c42;border-radius:12px;padding:16px}.stat{font-size:26px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #232c42;padding:8px;text-align:left}a{color:#7fb3ff}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head>
<body><header><h2 style="margin:0">📺 Sponsorship Analyzer <small style="color:#8b93a7">24/7</small></h2>
<input id="q" placeholder="Search brand e.g. nordvpn" style="min-width:220px"><input id="cat" placeholder="Category filter"><input id="yf" placeholder="Year from" style="width:90px"><input id="yt" placeholder="Year to" style="width:90px">
<button onclick="doSearch()">Search</button><button onclick="exportCsv()">⬇ Export CSV</button><button onclick="brandView()">Brand deep-dive</button></header>
<main>
<div class="card"><h3>Stats</h3><div id="stats" class="row"></div><canvas id="ch" height="120"></canvas></div>
<div class="card"><h3>Add creators / niches (auto-expand)</h3>
<div class="row"><input id="niche" placeholder="Type niche e.g. tech SaaS, healthcare"><button onclick="addNiche()">Discover creators</button></div>
<div class="row" style="margin-top:8px"><input id="chan" placeholder="Channel URL / UC id / @handle" style="min-width:260px"><button onclick="addCreator()">Add creator</button>
<button onclick="scan()">⚡ Scan now</button></div><div id="msg"></div><h4>Niche hunts (endless)</h4><div id="niches"></div><h4>Creators</h4><div id="creators"></div></div>
<div class="card" style="grid-column:1/-1"><h3>Results</h3><table><thead><tr><th>Brand</th><th>Cat</th><th>Creator</th><th>Video</th><th>Published</th><th>Evidence</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card" style="grid-column:1/-1"><h3 id="bt">Brand analytics</h3><div id="banal"></div></div>
</main><script>
async function j(u,o){const r=await fetch(u,o);return r.json()}
async function load(){const s=await j('/api/stats');document.getElementById('stats').innerHTML=`<div class="card"><div class="stat">${s.creators}</div>creators</div><div class="card"><div class="stat">${s.videos_analyzed}/${s.videos}</div>videos analyzed</div><div class="card"><div class="stat">${s.sponsorships}</div>sponsorships</div><div class="card"><div class="stat">${s.brands}</div>brands</div>`;const c=await j('/api/creators');document.getElementById('creators').innerHTML=c.slice(-30).map(x=>`<div>${x.name} <small style="color:#8b93a7">${x.niche}</small></div>`).join('')||'none yet — add a niche above';const n=await j('/api/niches');document.getElementById('niches').innerHTML=n.map(x=>`<div>🔍 <b>${x.niche}</b>: ${x.creators} creators, ${x.with_brand_or_done} resolved, ${x.still_digging} still digging, ${x.videos_checked} videos checked</div>`).join('')||'none yet';doSearch()}
async function doSearch(){const q=document.getElementById('q').value,cat=document.getElementById('cat').value,yf=document.getElementById('yf').value,yt=document.getElementById('yt').value;const r=await j(`/api/search?q=${encodeURIComponent(q)}&category=${encodeURIComponent(cat)}&year_from=${yf||0}&year_to=${yt||0}&limit=200`);document.getElementById('rows').innerHTML=r.map(x=>`<tr><td><b>${x.brand}</b></td><td>${x.category}</td><td>${x.creator}</td><td><a href="${x.video_url}" target="_blank">${(x.video||'').slice(0,60)}</a></td><td>${(x.published||'').slice(0,10)}</td><td>${(x.evidence||'').slice(0,120)}</td></tr>`).join('')}
async function brandView(){const q=document.getElementById('q').value||'nordvpn';const d=await j('/api/brand/'+encodeURIComponent(q));document.getElementById('bt').textContent=`${d.brand} — ${d.total} deals`;document.getElementById('banal').innerHTML=`<p><b>Per creator:</b> ${JSON.stringify(d.per_creator)}<br><b>Per topic:</b> ${JSON.stringify(d.per_topic)}<br><b>Per year:</b> ${JSON.stringify(d.per_year)}</p>`+d.videos.map(v=>`<div>• <a href="${v.url}" target="_blank">${(v.video||'').slice(0,70)}</a> — ${v.creator} ${(v.published||'').slice(0,10)}</div>`).join('');const ctx=document.getElementById('ch');new Chart(ctx,{type:'bar',data:{labels:Object.keys(d.per_year),datasets:[{label:d.brand+' deals/year',data:Object.values(d.per_year)}]}})}
async function addNiche(){const n=document.getElementById('niche').value;if(!n)return alert('type a niche');document.getElementById('msg').textContent='discovering… (scraping, ~30s)';const r=await j('/api/niche?niche='+encodeURIComponent(n)+'&limit=30',{method:'POST'});document.getElementById('msg').textContent=`found ${r.discovered}, added ${r.added} — hunt runs endlessly, watch progress below`;load()}
async function addCreator(){const c=document.getElementById('chan').value;const r=await j('/api/creators?channel='+encodeURIComponent(c)+'&niche=general',{method:'POST'});document.getElementById('msg').textContent=JSON.stringify(r);load()}
async function scan(){document.getElementById('msg').textContent='scanning…';const r=await j('/api/scan',{method:'POST'});document.getElementById('msg').textContent=`scan: ${r.videos} videos, ${r.brands} new brands`;load()}
function exportCsv(){const q=document.getElementById('q').value,cat=document.getElementById('cat').value,yf=document.getElementById('yf').value,yt=document.getElementById('yt').value;window.location=`/api/export.csv?q=${encodeURIComponent(q)}&category=${encodeURIComponent(cat)}&year_from=${yf||0}&year_to=${yt||0}&limit=5000`}
load()
</script></body></html>
